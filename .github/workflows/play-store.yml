name: Play Store

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - if: github.ref_type != 'tag'
        run: echo "::error::Pick a release tag in 'Use workflow from', not a branch" && exit 1

      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - run: nix develop .#android-ci -c npm ci

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_STORE_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_STORE_FILE_BASE64 }}
        run: |
          echo "$ANDROID_RELEASE_STORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and upload to the Play Store closed testing track
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          PLAY_JSON_KEY_CONTENT: ${{ secrets.PLAY_JSON_KEY_CONTENT }}
        run: nix develop .#android-ci -c fastlane android beta

      - name: Attach the APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .expo.version app.json)
          cp android/app/build/outputs/apk/release/app-release.apk "ReptiKeep-$VERSION.apk"
          gh release upload "$VERSION" "ReptiKeep-$VERSION.apk" --clobber
