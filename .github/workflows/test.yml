name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - run: nix develop .#js-ci -c npm ci
      - run: nix develop .#js-ci -c npm run lint
      - run: nix develop .#js-ci -c npx prettier --check "src/**/*.{ts,tsx,json}" "*.{js,json,md,ts,tsx}"
      - run: nix develop .#js-ci -c npm test -- --ci

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - run: nix develop .#js-ci -c npm ci
      - run: nix develop .#js-ci -c npm run typecheck:${{ matrix.platform }}

  export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - run: nix develop .#js-ci -c npm ci
      - run: nix develop .#js-ci -c npx expo export --platform ${{ matrix.platform }} --output-dir /tmp/export-${{ matrix.platform }}
