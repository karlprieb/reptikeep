name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: macos-26
    steps:
      - if: github.ref_type != 'tag'
        run: echo "::error::Pick a release tag in 'Use workflow from', not a branch" && exit 1

      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - run: nix develop .#ios-ci -c npm ci

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: nix develop .#ios-ci -c fastlane ios beta

      - name: Attach the IPA to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .expo.version app.json)
          cp build/ReptiKeep.ipa "ReptiKeep-$VERSION.ipa"
          gh release upload "$VERSION" "ReptiKeep-$VERSION.ipa" --clobber
